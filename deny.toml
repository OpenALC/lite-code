# cargo-deny 配置，CI 的 deny job 执行 `cargo deny check --locked`。
# 许可证策略：双许可 Apache-2.0 OR MIT 的依赖树必须保持可再分发。
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
# 以下均为“上游不再维护”通告，非漏洞；当前依赖树没有安全升级路径：
#   proc-macro-error ← glib-macros（Linux GTK 构建期依赖，Tauri 2 上游）
#   zvariant / zbus_names / zvariant_derive ← zbus 5（Tauri 单实例插件上游）
# 显式列 ID 而不是关掉 unmaintained 检查，其它新通告仍会阻断。
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
