[workspace]
resolver = "2"
members = [
    "crates/lc-proto",
    "crates/lc-core",
    "crates/lc-cli",
    "crates/lc-host",
    "crates/lc-ohos",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.6.1-preview.67"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0 OR MIT"
authors = ["lite-code contributors"]

[workspace.dependencies]
# 内部 crate 带 version：cargo-deny 的 wildcards=deny 检查要求无通配依赖
lc-proto = { version = "0.6.1-preview.67", path = "crates/lc-proto" }
lc-core = { version = "0.6.1-preview.67", path = "crates/lc-core" }
lc-host = { version = "0.6.1-preview.67", path = "crates/lc-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }
# M3 签名强制档（docs/plans/plugin-marketplace.md §3.7）：minisign 验签，
# MIT 许可（已过 deny.toml 白名单），零外部依赖。
minisign-verify = "0.3.0"

[profile.release]
strip = "debuginfo"
