[workspace]
resolver = "2"
members = [
    "crates/lc-proto",
    "crates/lc-core",
    "crates/lc-cli",
    "crates/lc-ohos",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.6.1-preview.63"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0 OR MIT"
authors = ["lite-code contributors"]

[workspace.dependencies]
# 内部 crate 带 version：cargo-deny 的 wildcards=deny 检查要求无通配依赖
lc-proto = { version = "0.6.1-preview.63", path = "crates/lc-proto" }
lc-core = { version = "0.6.1-preview.63", path = "crates/lc-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }

[profile.release]
strip = "debuginfo"
