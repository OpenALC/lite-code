[workspace]
resolver = "2"
members = [
    "crates/lc-proto",
    "crates/lc-core",
    "crates/lc-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1-preview.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
authors = ["lite-code contributors"]

[workspace.dependencies]
lc-proto = { path = "crates/lc-proto" }
lc-core = { path = "crates/lc-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }

[profile.release]
strip = "debuginfo"
