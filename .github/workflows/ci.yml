name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # 仓库当前处于文档阶段，Rust / 前端源码尚未落地。
  # 统一在这里探测，下游 job 根据 outputs 跳过，避免每次 PR 都红。
  prep:
    name: prep
    runs-on: ubuntu-22.04
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      web: ${{ steps.detect.outputs.web }}
      lanes: ${{ steps.detect.outputs.lanes }}
      deny: ${{ steps.detect.outputs.deny }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "lanes=$([ -x scripts/check-lanes.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "deny=$([ -f deny.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # 三处版本必须一致：rust-toolchain.toml / Cargo.toml rust-version / ci.yml env。
      # 任意一处漂移即 fail，这是 MSRV 漂移（PLAN.md R8）的第一道闸。
      - name: assert toolchain consistency
        shell: bash
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then
            ch=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | head -n1)
            if [ -z "$ch" ]; then echo "::error::rust-toolchain.toml 缺少 channel"; exit 1; fi
            if [ "$ch" != "$RUST_TOOLCHAIN" ]; then
              echo "::error::rust-toolchain.toml ($ch) 与 ci.yml ($RUST_TOOLCHAIN) 不一致"
              exit 1
            fi
          fi
          if [ -f Cargo.toml ]; then
            rv=$(sed -n 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n1)
            if [ -n "$rv" ] && [ "${rv%.*}" != "${RUST_TOOLCHAIN%.*}" ]; then
              echo "::error::Cargo.toml rust-version ($rv) 与 $RUST_TOOLCHAIN 不一致"
              exit 1
            fi
          fi

  version-guard:
    name: version guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 主版本只能由维护者显式声明；执行者不得自行改动（docs/VERSIONING.md §1）。
      # ALLOW_V1 是仓库变量，不是 PR 可改的文件。
      - name: check version
        env:
          ALLOW_V1: "${{ vars.ALLOW_V1 == 'true' && 'true' || 'false' }}"
        run: node scripts/check-version.mjs

  rust-fmt:
    name: fmt
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust-clippy:
    name: clippy (${{ matrix.os }})
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: test (${{ matrix.os }})
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace --locked
      - name: golden outputs (lc-cli)
        if: runner.os == 'Windows'
        run: cargo run --locked -p lc-cli -- --version

  contract:
    name: contract drift
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: regenerate TS bindings
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rq "codegen" crates/lc-proto 2>/dev/null; then
            echo "::notice::lc-proto codegen 未实现，跳过漂移检查"
            exit 0
          fi
          cargo run --locked -p lc-proto --features codegen --bin codegen
          git diff --exit-code || { echo "::error::契约绑定未同步，请重新生成并提交"; exit 1; }

  lanes:
    name: lane boundaries
    needs: prep
    if: needs.prep.outputs.lanes == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-lanes.sh

  web:
    name: web
    needs: prep
    if: needs.prep.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 省略 → 读取根 package.json 的 packageManager 字段，单一来源
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      # 插件运行器是独立 Node 子项目，不依赖 pnpm workspace。
      - run: node sidecars/ext-host/build.mjs --check
      - run: node --test sidecars/ext-host/test/*.test.mjs
      - run: node sidecars/wasm-host/scripts/build.mjs --check
      - run: node --test sidecars/wasm-host/test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  db-bridge:
    name: db-bridge
    needs: prep
    if: needs.prep.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 驱动连接参数/schema/read_only 的单测，不连真实数据库。
      - run: pnpm db:bridge:check
      - run: pnpm db:bridge:test
      # 提交的 crates/lc-core/assets/db-bridge.mjs 必须与 apps/db-bridge 同步。
      - run: pnpm db:bridge:build:check

  audit:
    name: pnpm audit
    needs: prep
    if: needs.prep.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 省略 → 读取根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # setup-node 的 pnpm cache 需要 store 存在；先安装依赖再 audit。
      - name: install deps for audit
        run: pnpm install --frozen-lockfile --ignore-scripts
      # 网络失败与 high/critical 漏洞都必须让 job 失败；不允许 continue-on-error
      # 静默通过。--prod 只审计会进入安装包的生产依赖。
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

  updater-manifest:
    name: updater manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 生成器无第三方依赖；覆盖 signed:false / 混合签名 / previous / URL 资产。
      - run: node --test scripts/gen-update-manifest.test.mjs

  deny:
    name: cargo-deny
    needs: prep
    if: needs.prep.outputs.rust == 'true' && needs.prep.outputs.deny == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
          # 仓库 rust-toolchain.toml 会 override action 自带的 musl 工具链；
          # 显式传入与文件一致的版本，让 action 先行安装，避免 rustup 报未安装
          rust-version: "1.99.1"

  summary:
    name: ci
    needs: [prep, version-guard, rust-fmt, rust-clippy, rust-test, contract, lanes, web, db-bridge, audit, updater-manifest, deny]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: fail if any required job failed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "::error::以下 job 失败：$bad"
            exit 1
          fi
