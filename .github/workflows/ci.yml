name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # 仓库当前处于文档阶段，Rust / 前端源码尚未落地。
  # 统一在这里探测，下游 job 根据 outputs 跳过，避免每次 PR 都红。
  prep:
    name: prep
    runs-on: ubuntu-22.04
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      web: ${{ steps.detect.outputs.web }}
      lanes: ${{ steps.detect.outputs.lanes }}
      deny: ${{ steps.detect.outputs.deny }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "lanes=$([ -x scripts/check-lanes.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "deny=$([ -f deny.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # 三处版本必须一致：rust-toolchain.toml / Cargo.toml rust-version / ci.yml env。
      # 任意一处漂移即 fail，这是 MSRV 漂移（PLAN.md R8）的第一道闸。
      - name: assert toolchain consistency
        shell: bash
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then
            ch=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | head -n1)
            if [ -z "$ch" ]; then echo "::error::rust-toolchain.toml 缺少 channel"; exit 1; fi
            if [ "$ch" != "$RUST_TOOLCHAIN" ]; then
              echo "::error::rust-toolchain.toml ($ch) 与 ci.yml ($RUST_TOOLCHAIN) 不一致"
              exit 1
            fi
          fi
          if [ -f Cargo.toml ]; then
            rv=$(sed -n 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n1)
            if [ -n "$rv" ] && [ "${rv%.*}" != "${RUST_TOOLCHAIN%.*}" ]; then
              echo "::error::Cargo.toml rust-version ($rv) 与 $RUST_TOOLCHAIN 不一致"
              exit 1
            fi
          fi

  rust-fmt:
    name: fmt
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust-clippy:
    name: clippy (${{ matrix.os }})
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: test (${{ matrix.os }})
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace --locked
      - name: golden outputs (lc-cli)
        if: runner.os == 'Windows'
        run: cargo run --locked -p lc-cli -- --version

  contract:
    name: contract drift
    needs: prep
    if: needs.prep.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: regenerate TS bindings
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rq "codegen" crates/lc-proto 2>/dev/null; then
            echo "::notice::lc-proto codegen 未实现，跳过漂移检查"
            exit 0
          fi
          cargo run --locked -p lc-proto --features codegen --bin codegen
          git diff --exit-code || { echo "::error::契约绑定未同步，请重新生成并提交"; exit 1; }

  lanes:
    name: lane boundaries
    needs: prep
    if: needs.prep.outputs.lanes == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-lanes.sh

  web:
    name: web
    needs: prep
    if: needs.prep.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version 省略 → 读取根 package.json 的 packageManager 字段，单一来源
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  deny:
    name: cargo-deny
    needs: prep
    if: needs.prep.outputs.rust == 'true' && needs.prep.outputs.deny == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  summary:
    name: ci
    needs: [prep, rust-fmt, rust-clippy, rust-test, contract, lanes, web, deny]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: fail if any required job failed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "::error::以下 job 失败：$bad"
            exit 1
          fi
