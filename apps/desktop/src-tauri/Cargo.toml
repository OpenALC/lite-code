[package]
name = "lc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lite Code Tauri 薄壳：窗口、命令注册与转发"

# 分层约束（docs/ARCHITECTURE.md L2）：薄壳只做命令注册与转发，
# 任何业务逻辑必须下沉到 lc-core。

[lib]
name = "lc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建启用：把 frontendDist 嵌入二进制，避免加载 devUrl 得到空 WebView。
# 标准 Tauri 模板同名 feature；`pnpm tauri build` 会自动启用。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘常驻（docs/ARCHITECTURE.md §6：关闭 → 销毁 WebView，核心托盘常驻）。
# 仅编译期开关，运行时才创建托盘——Linux CI 无显示环境也能编译/测试。
tauri = { version = "2", features = ["tray-icon"] }
# 单实例（docs/ARCHITECTURE.md §6 生命周期第一步）。v2 系与 tauri 2.12 匹配。
tauri-plugin-single-instance = "2.5"
# 更新检查只拉取静态 JSON；复用 lc-core 已锁定的 ureq 版本，不新增第三方包。
ureq = "3.5.1"
# 原生文件夹选择器（打开工作区）；仅桌面壳使用。
rfd = "0.15"
lc-core = { workspace = true }
lc-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
