[package]
name = "lc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lite Code 核心服务：零 tauri 依赖，可 headless 运行"

# 三条不可退让约束之一（docs/README.md）：
# 本 crate 不依赖 tauri。所有服务通过 CoreHandle trait 暴露给外壳。
[dependencies]
lc-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# fs lane（docs/ARCHITECTURE.md §5.2）：ignore 遍历 + notify 监听
globset = "0.4"
ignore = "0.4"
notify = "8"
regex = "1"
notify-debouncer-full = "0.5"
dirs = "7.0.0"
ureq = "3.5.1"
# 只保留 Node 发行包需要的 deflate；默认特性会带入 bzip2/zstd/lzma，
# 其中 bzip2 的许可证不在 deny.toml 白名单内（且这些格式运行时用不到）。
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"
winreg = "0.52"
